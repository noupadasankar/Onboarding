apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: optiagent-staging
  labels:
    app: backend
    app.kubernetes.io/name: optiagent
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/part-of: optiagent-platform
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: optiagent
        app.kubernetes.io/component: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: optiagent-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/optiagent/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: BACKEND_PORT
              value: "8000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: optiagent-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: optiagent-secrets
                  key: redis-url
            - name: JWT_PRIVATE_KEY_PATH
              value: "/secrets/jwt-private.pem"
            - name: JWT_PUBLIC_KEY_PATH
              value: "/secrets/jwt-public.pem"
            - name: CORS_ORIGINS
              value: "https://staging.optiagent.example.com"
            - name: AI_SERVICE_URL
              value: "http://ai-service.optiagent-staging.svc.cluster.local:8100"
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: optiagent-secrets
                  key: internal-service-token
            - name: LOG_LEVEL
              value: "info"
          envFrom:
            - secretRef:
                name: optiagent-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: jwt-keys
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys
            defaultMode: 0400
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - backend
                topologyKey: kubernetes.io/hostname