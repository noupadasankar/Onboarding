apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-blue
  namespace: optiagent-prod
  labels:
    app: backend
    color: blue
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
      color: blue
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
        color: blue
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: optiagent-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: backend
          image: ghcr.io/optiagent/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: BACKEND_PORT
              value: "8000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: optiagent-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: optiagent-secrets
                  key: redis-url
            - name: JWT_PRIVATE_KEY_PATH
              value: "/app/backend/secrets/jwt-private.pem"
            - name: JWT_PUBLIC_KEY_PATH
              value: "/app/backend/secrets/jwt-public.pem"
            - name: CORS_ORIGINS
              value: "https://optiagent.example.com"
            - name: AI_SERVICE_URL
              value: "http://ai-service:8100"
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: optiagent-secrets
                  key: internal-service-token
            - name: LOG_LEVEL
              value: "info"
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "http://otel-collector:4318/v1/traces"
          envFrom:
            - secretRef:
                name: optiagent-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: jwt-secrets
              mountPath: /app/backend/secrets
              readOnly: true
      volumes:
        - name: jwt-secrets
          secret:
            secretName: optiagent-jwt-keys
            defaultMode: 0400
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [backend]
                topologyKey: kubernetes.io/hostname