apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: optiagent-prod
  labels:
    app: backend
    app.kubernetes.io/name: optiagent
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: backend
    # This selector matches BOTH blue and green - traffic goes to both
    # Blue/green switching is done via ingress annotations or service mesh