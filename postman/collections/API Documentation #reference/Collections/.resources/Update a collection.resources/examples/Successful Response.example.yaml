$kind: http-example
request:
  url: https://api.getpostman.com/collections/12ece9e1-2abf-4edc-8e34-de66e74114d2
  method: PUT
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
          "collection": {
              "info": {
                  "name": "Test Collection",
                  "description": "This collection makes a request to the Postman Echo service to get a list of request headers sent by an HTTP client.",
                  "schema": "https://schema.getpostman.com/json/collection/v2.1.0/collection.json"
              },
              "item": [
                  {
                      "name": "Test POST Response",
                      "event": [
                          {
                              "listen": "test",
                              "script": {
                                  "id": "7d2334fc-a84a-4c3d-b26c-7529afa4c0ae",
                                  "exec": [
                                      "pm.test(\"Status code is 200\", function () {",
                                      "    pm.response.to.have.status(200);",
                                      "});"
                                      ],
                                  "type": "text/javascript"
                                  }
                              }
                          ],
                      "request": {
                          "url": "https://echo.getpostman.com/headers",
                          "method": "POST",
                          "header": [
                              {
                                  "key": "Content-Type",
                                  "value": "application/json"
                              }
                          ]
                      }
                  }
              ]
          }
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
          "collection": {
              "id": "12ece9e1-2abf-4edc-8e34-de66e74114d2",
              "name": "Test Collection",
              "uid": "12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2"
          }
      }
order: 1000
