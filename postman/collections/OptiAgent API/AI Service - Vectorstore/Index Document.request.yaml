$kind: http-request
name: Index Document
method: POST
url: '{{aiServiceUrl}}/api/v1/documents/:document_id/index'
order: 2000
headers:
  - key: X-Internal-Token
    value: '{{internalToken}}'
pathVariables:
  - key: document_id
    value: '{{aiDocumentId}}'
queryParams:
  - key: chunk_size
    value: '800'
  - key: overlap
    value: '100'
  - key: min_tokens
    value: '50'
  - key: reindex
    value: 'false'
