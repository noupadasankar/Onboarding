$kind: http-request
name: Index Document by Path
method: POST
url: '{{aiServiceUrl}}/api/v1/documents/index'
order: 1000
headers:
  - key: X-Internal-Token
    value: '{{internalToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "document_id": "{{documentId}}",
      "storage_path": "/path/to/file.pdf",
      "filename": "file.pdf",
      "department": "hr",
      "is_latest": true,
      "version": 1
    }
