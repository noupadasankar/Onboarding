[project]
name = "optiagent-ai-service"
version = "0.1.0"
description = "OptiAgent AI service — document ingestion, RAG, LangGraph agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.114,<0.116",
    "uvicorn[standard]>=0.30,<0.32",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "python-dotenv>=1.0,<2",
    "structlog>=24.4,<26",
    # ── Observability ──
    "opentelemetry-api>=1.25,<2",
    "opentelemetry-sdk>=1.25,<2",
    "opentelemetry-exporter-otlp>=1.25,<2",
    "opentelemetry-instrumentation-fastapi>=0.46,<1",
    "opentelemetry-instrumentation-httpx>=0.46,<1",
    "opentelemetry-instrumentation-sqlalchemy>=0.46,<1",
    "opentelemetry-instrumentation-redis>=0.46,<1",
    "opentelemetry-instrumentation-logging>=0.46,<1",
    "prometheus-client>=0.19,<1",
    # ── Increment 3: document ingestion ──────────────────────────────────────
    "python-multipart>=0.0.12,<0.1",
    "pypdf>=4.3,<5",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "chardet>=5.2,<6",
    # ── Increment 4: text cleaning & chunking ────────────────────────────────
    "tiktoken>=0.7,<1",
    # ── Increment 5: embeddings ───────────────────────────────────────────────
    # openai is optional but listed here so `pip install -e .` picks it up.
    # Remove if you only use the local provider.
    "openai>=1.40,<2",
    # ── Increment 6: vector database ─────────────────────────────────────────
    "chromadb==0.6.3",
    # ── Increment 9: LangGraph multi-agent orchestration ─────────────────────
    "langgraph>=0.2,<1",
    # ── Increment 10: hybrid search (BM25 + dense RRF) ───────────────────────
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.26",
    "httpx>=0.27,<0.29",
    "ruff>=0.6,<1",
    "black>=24,<25",
    "mypy>=1.11,<2",
    "fpdf2>=2.7,<3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ARG", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
