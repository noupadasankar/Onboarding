# OptiAgent local orchestration.
#
# Fast path for development (recommended): start only infrastructure and run the
# three services on the host with hot reload:
#
#   docker compose -f docker/docker-compose.yml up -d postgres redis chromadb
#
# Full-stack path (build + run everything in containers):
#
#   docker compose -f docker/docker-compose.yml --profile full up --build
#
# Env is read from the repo-root .env (copy from .env.example).

name: optiagent

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-optiagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-prod}
      POSTGRES_DB: ${POSTGRES_DB:-optiagent}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-optiagent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chromadb:
    image: chromadb/chroma:0.6.3
    ports:
      - "${CHROMA_PORT:-8001}:8000"
    volumes:
      - chromadata:/chroma/chroma

  backend:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      BACKEND_PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-optiagent}:${POSTGRES_PASSWORD:-change-me-in-prod}@postgres:5432/${POSTGRES_DB:-optiagent}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_PRIVATE_KEY_PATH: ./secrets/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: ./secrets/jwt-public.pem
      CORS_ORIGINS: http://localhost:3000
      AI_SERVICE_URL: http://ai-service:8100
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-me-internal-service-token}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Mount generated JWT keys into the container at the expected path.
      - ../backend/secrets:/app/backend/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-service:
    profiles: ["full"]
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    environment:
      AI_ENV: production
      AI_SERVICE_PORT: 8100
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-me-internal-service-token}
      CHROMA_URL: http://chromadb:8000
    ports:
      - "${AI_SERVICE_PORT:-8100}:8100"
    depends_on:
      - chromadb

  frontend:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    expose:
      - "80"
    depends_on:
      - backend

  nginx:
    profiles: ["full"]
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  chromadata:
