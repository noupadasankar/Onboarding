# NGINX config baked into the frontend image — serves the built SPA with
# history-API fallback so client-side routes (e.g. /dashboard) resolve on reload.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
