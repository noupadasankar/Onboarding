name: CD - Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: '20'

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend-image: ${{ steps.meta-backend.outputs.tags }}
      frontend-image: ${{ steps.meta-frontend.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @optiagent/backend prisma:generate

      - name: Build shared
        run: pnpm --filter @optiagent/shared build

      - name: Build backend
        run: pnpm --filter @optiagent/backend build

      - name: Build frontend
        run: pnpm --filter @optiagent/frontend build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to staging (Kubernetes)
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.STAGING_KUBECONFIG }}

      - name: Update image tags in staging manifests
        run: |
          sed -i "s|ghcr.io/.*/backend:.*|${{ needs.build-and-push.outputs.backend-image }}|g" k8s/staging/backend-deployment.yaml
          sed -i "s|ghcr.io/.*/frontend:.*|${{ needs.build-and-push.outputs.frontend-image }}|g" k8s/staging/frontend-deployment.yaml

      - name: Apply staging manifests
        run: |
          kubectl apply -f k8s/staging/namespace.yaml
          kubectl apply -f k8s/staging/
          kubectl rollout status deployment/backend -n optiagent-staging --timeout=300s
          kubectl rollout status deployment/frontend -n optiagent-staging --timeout=300s

      - name: Run smoke tests
        run: |
          sleep 15
          curl -f https://staging.optiagent.example.com/health || exit 1
          curl -f https://staging.optiagent.example.com/api/health/ready || exit 1

      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "❌ Staging deployment failed for ${{ github.repository }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Staging Deployment Failed*\nRepo: ${{ github.repository }}\nCommit: ${{ github.sha }}\nRun: ${{ github.run_url }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to production (Kubernetes)
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.PRODUCTION_KUBECONFIG }}

      - name: Update image tags in production manifests
        run: |
          sed -i "s|ghcr.io/.*/backend:.*|${{ needs.build-and-push.outputs.backend-image }}|g" k8s/production/backend-deployment.yaml
          sed -i "s|ghcr.io/.*/frontend:.*|${{ needs.build-and-push.outputs.frontend-image }}|g" k8s/production/frontend-deployment.yaml

      - name: Apply production manifests (Blue/Green)
        run: |
          # Blue/Green deployment using Argo Rollouts or standard rolling update
          kubectl apply -f k8s/production/namespace.yaml
          kubectl apply -f k8s/production/
          kubectl rollout status deployment/backend -n optiagent-prod --timeout=600s
          kubectl rollout status deployment/frontend -n optiagent-prod --timeout=300s

      - name: Run production smoke tests
        run: |
          sleep 30
          curl -f https://optiagent.example.com/health || exit 1
          curl -f https://optiagent.example.com/api/health/ready || exit 1

      - name: Post-deployment notification
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "✅ Production deployment successful",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment Complete*\nRepo: ${{ github.repository }}\nVersion: ${{ needs.build-and-push.outputs.backend-image }}\nDeployed by: ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          generate_release_notes: true
          draft: false
          prerelease: false